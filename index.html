<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas del RIPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Dirección: carta náutica nocturna. Mar profundo, señales de babor (rojo), estribor (verde) y bandera amarilla como acento. Rejilla: barra lateral de navegación + área de trabajo con escenario a la izquierda y apuntes a la derecha. */
:root{
  --bg:#06101c;--panel:#0b1b2d;--panel2:#10263c;--line:#1f3d5a;--line2:#2c5073;
  --ink:#e8f0f8;--ink2:#a9bccf;--ink3:#7690aa;
  --sig:#f5c542;--port:#ff5566;--stbd:#27e08c;--info:#6fb7ff;--cyan:#7cf0ff;--warn:#ff9f43;
  --fd:'Barlow Condensed','Arial Narrow',sans-serif;--fb:'IBM Plex Sans',system-ui,sans-serif;--fm:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--fb);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fd);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
p{margin:0}
button,select,input{font:inherit;color:inherit}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
.app{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100%}
/* barra lateral */
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:18px 14px 28px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px;text-decoration:none;color:var(--ink)}
.brand b{font:700 28px/1 var(--fd);letter-spacing:.04em}
.brand span{font:500 11px/1.3 var(--fm);color:var(--ink3);text-transform:uppercase}
.brand .flag{width:30px;height:30px;border:1px solid var(--line2);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;flex:none}
.brand .flag i:nth-child(1){background:var(--sig)}.brand .flag i:nth-child(2){background:#1b4fa0}.brand .flag i:nth-child(3){background:#1b4fa0}.brand .flag i:nth-child(4){background:var(--sig)}
.grp{margin:14px 0 4px;padding:0 8px;font:600 11px/1.3 var(--fm);text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.nav a{display:flex;gap:10px;align-items:baseline;padding:6px 8px;border-radius:6px;color:var(--ink2);text-decoration:none;font-size:14px;line-height:1.35;border-left:3px solid transparent}
.nav a b{font:600 13px var(--fm);color:var(--ink3);min-width:22px;text-align:right}
.nav a:hover{background:var(--panel2);color:var(--ink)}
.nav a[aria-current=page]{background:var(--panel2);color:var(--ink);border-left-color:var(--sig)}
.nav a[aria-current=page] b{color:var(--sig)}
.top{display:none}
/* área principal */
main{padding:28px clamp(16px,3vw,44px) 56px;min-width:0;max-width:1400px;width:100%}
.rhead{display:flex;gap:22px;align-items:flex-start;margin-bottom:22px}
.rnum{font:700 clamp(64px,9vw,112px)/.82 var(--fd);color:transparent;-webkit-text-stroke:2px var(--sig);min-width:1.1ch;letter-spacing:-.02em}
.eyebrow{font:600 12px/1.3 var(--fm);text-transform:uppercase;letter-spacing:.07em;color:var(--sig);margin-bottom:6px}
.rhead h1{font-size:clamp(34px,4.6vw,56px);line-height:1}
.lead{color:var(--ink2);max-width:70ch;margin-top:10px;font-size:17px}
.work{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:22px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card+.card{margin-top:14px}
.card h3{font:600 12px/1.2 var(--fm);text-transform:uppercase;letter-spacing:.08em;color:var(--sig);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:14px;height:2px;background:var(--sig)}
.card ul{margin:0;padding-left:18px;color:var(--ink2);font-size:15px}
.card li+li{margin-top:6px}
.card p{color:var(--ink2);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chip{display:inline-block;padding:3px 10px;border:1px solid var(--line2);border-radius:99px;font:500 13px var(--fm);color:var(--ink2);text-decoration:none;background:transparent;cursor:pointer}
.chip:hover{border-color:var(--sig);color:var(--sig)}
/* escenario */
.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ctrls{display:flex;flex-wrap:wrap;gap:12px 22px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
.ctrls:empty{display:none}
.ctl{display:flex;flex-direction:column;gap:5px;min-width:0}
.cl{font:600 11px/1.2 var(--fm);text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line2);border-radius:7px;overflow:hidden;background:var(--bg)}
.seg button{background:transparent;border:0;padding:6px 11px;font-size:13px;color:var(--ink2);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--sig);color:#1a1400;font-weight:600}
.rg{display:flex;align-items:center;gap:10px}
.rg input{width:170px;accent-color:var(--sig)}
.rg output{font:500 13px var(--fm);color:var(--sig);min-width:5.5ch}
.ctl select{background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:6px 8px;font-size:13px;max-width:240px}
.ck{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);cursor:pointer}
.ck input{accent-color:var(--sig);width:16px;height:16px}
.cvw{position:relative;width:100%;aspect-ratio:16/10;background:#0e3d5e}
.cvw.sq{aspect-ratio:1/1;max-width:600px;margin:0 auto}
.cvw canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 14px;border-top:1px solid var(--line);background:var(--panel2)}
.btn{background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:6px 14px;font-size:14px;cursor:pointer;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--sig)}
.btn.pri{background:var(--sig);border-color:var(--sig);color:#1a1400;font-weight:600}
.bar input[type=range]{flex:1;min-width:120px;accent-color:var(--sig)}
.bar .tm{font:500 13px var(--fm);color:var(--ink2);min-width:8ch}
.bar select{background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:5px 8px;font-size:13px}
.hud{padding:12px 16px 14px;border-top:1px solid var(--line)}
.hud dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 18px;margin:0 0 10px}
.hud dt{font:600 10.5px/1.2 var(--fm);text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.hud dd{margin:2px 0 0;font:500 14px var(--fm);color:var(--ink);font-variant-numeric:tabular-nums}
.msg{padding:9px 12px;border-radius:7px;font-size:15px;border-left:4px solid var(--info);background:rgba(111,183,255,.1);color:var(--ink)}
.msg.ok{border-color:var(--stbd);background:rgba(39,224,140,.1)}
.msg.warn{border-color:var(--warn);background:rgba(255,159,67,.12)}
.msg.bad{border-color:var(--port);background:rgba(255,85,102,.12)}
.extra{padding:0 16px 16px}
.extra:empty{display:none}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}
.pager a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);padding:10px 14px;border:1px solid var(--line);border-radius:8px;min-width:0;max-width:48%}
.pager a:hover{border-color:var(--sig)}
.pager small{font:600 11px var(--fm);color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.pager a:last-child{text-align:right;margin-left:auto}
/* inicio */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:26px}
.hero h1{font-size:clamp(40px,6.2vw,84px);line-height:.94}
.hero h1 em{font-style:normal;color:var(--sig)}
.hero .cvw{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}
.part{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.part.on{border-color:var(--line2)}
.part.off{opacity:.55}
.part b{font:700 40px/1 var(--fd);color:var(--sig)}
.part.off b{color:var(--ink3)}
.part span{font:600 11px var(--fm);text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.rg1{display:flex;gap:8px;align-items:baseline;padding:9px 11px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);background:var(--panel);font-size:14px;line-height:1.25}
.rg1 b{font:700 22px/1 var(--fd);color:var(--sig);min-width:1.6ch}
.rg1:hover{border-color:var(--sig)}
.sec-h{font:700 26px var(--fd);margin:26px 0 10px}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.case{display:block;border:1px solid var(--line);border-radius:10px;padding:13px 14px;text-decoration:none;color:var(--ink);background:var(--panel)}
.case:hover{border-color:var(--sig)}
.case small{font:600 11px var(--fm);color:var(--sig);text-transform:uppercase;letter-spacing:.06em}
.case h4{margin:4px 0 4px;font:700 20px var(--fd)}
.case p{font-size:14px;color:var(--ink2)}
/* piezas específicas */
.band{display:grid;grid-template-columns:1fr;gap:10px;padding:14px}
.sect{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:var(--bg);display:flex;gap:14px;align-items:center;transition:background .25s,border-color .25s,opacity .25s;opacity:.45}
.sect.on{opacity:1;border-color:var(--stbd);background:rgba(39,224,140,.09)}
.sect b{font:700 30px/1 var(--fd);min-width:5.2ch;white-space:nowrap;color:var(--sig)}
.sect span{font-size:14px;color:var(--ink2)}
.zones{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.zones .chip[aria-pressed=true]{background:var(--sig);color:#1a1400;border-color:var(--sig)}
.svgw{background:#0e3d5e;line-height:0}
.svgw svg{width:100%;height:auto;display:block}
.qa{padding:16px}
.qa .q{font:700 22px/1.2 var(--fd);margin-bottom:12px}
.qa .yn{display:flex;gap:10px;flex-wrap:wrap}
.qa .res{padding:14px;border:1px solid var(--stbd);border-radius:9px;background:rgba(39,224,140,.09)}
.qa .res b{font:700 26px var(--fd);display:block;margin-bottom:4px}
.trail{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.trail .chip{cursor:default}
.defs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:14px}
.df{display:flex;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel)}
.df canvas{width:70px;height:56px;flex:none;background:#0e3d5e;border-radius:6px}
.df h4{font:700 19px/1.1 var(--fd);margin-bottom:3px}
.df p{font-size:13.5px;color:var(--ink2);line-height:1.4}
.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.cmp div{border:1px solid var(--line);border-top:3px solid var(--sig);border-radius:8px;padding:12px;background:var(--panel)}
.cmp b{font:700 18px var(--fd);display:block;margin-bottom:4px;color:var(--sig)}
.cmp p{font-size:13.5px;color:var(--ink2)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 6px;text-align:center}
.tbl th{background:var(--panel2);font:600 11px var(--fm);color:var(--ink2)}
.tbl th.rh{text-align:left;min-width:120px}
.tbl td{cursor:pointer;color:var(--ink3)}
.tbl td.y{color:var(--stbd);font-weight:700;background:rgba(39,224,140,.07)}
.tbl td.sel{outline:2px solid var(--sig);outline-offset:-2px}
.tbl td:hover{background:var(--panel2)}
.tblw{overflow-x:auto;padding:12px 14px}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
.step{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 8px 9px;cursor:pointer;text-align:left;transition:border-color .2s,background .2s}
.step b{font:700 22px/1 var(--fd);color:var(--ink3);display:block}
.step span{font-size:13px;color:var(--ink2)}
.step.on{border-color:var(--sig);background:rgba(245,197,66,.1)}
.step.on b{color:var(--sig)}
.step.done b{color:var(--stbd)}
.tl{display:flex;height:34px;border-radius:7px;overflow:hidden;border:1px solid var(--line2);font:600 11px var(--fm);margin:4px 0 0}
.tl div{flex:1;display:grid;place-items:center;background:var(--bg);color:var(--ink3);transition:background .2s}
.tl div.on{color:#10151c}
.tl div:nth-child(1).on{background:var(--stbd)}.tl div:nth-child(2).on{background:var(--sig)}.tl div:nth-child(3).on{background:var(--port)}
.errs{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.err{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.err button{all:unset;display:flex;gap:14px;align-items:flex-start;padding:16px;cursor:pointer;width:100%;box-sizing:border-box}
.err button:focus-visible{outline:2px solid var(--sig);outline-offset:-2px}
.err .n{font:700 40px/.9 var(--fd);color:var(--port);min-width:1.1ch}
.err h3{font:700 22px/1.15 var(--fd)}
.err .ans{display:none;padding:0 16px 16px 16px;border-top:1px dashed var(--line);margin-top:0}
.err.open .ans{display:block;padding-top:12px}
.err.open .n{color:var(--stbd)}
.ans p{font-size:15px;color:var(--ink2)}
.ans .chips{margin-top:10px}
.concl{counter-reset:c;display:grid;gap:10px;margin:0;padding:0;list-style:none}
.concl li{counter-increment:c;display:grid;grid-template-columns:54px 1fr;gap:14px;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--panel)}
.concl li::before{content:counter(c,decimal-leading-zero);font:700 40px/1 var(--fd);color:var(--sig)}
.concl b{display:block;font:700 22px var(--fd);margin-bottom:2px}
.concl p{color:var(--ink2);font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.plot{width:100%;height:190px;display:block;background:var(--bg);border:1px solid var(--line);border-radius:8px}
@media (max-width:1080px){.work{grid-template-columns:minmax(0,1fr)}.hero{grid-template-columns:1fr}.parts{grid-template-columns:repeat(2,minmax(0,1fr))}.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:30;transform:translateX(-102%);transition:transform .2s}
  body.nav-open .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
  .top{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .top b{font:700 22px var(--fd)}
  .top .btn{padding:5px 11px}
  .rhead{flex-direction:column;gap:6px}
  .rg input{width:130px}
}
@media (max-width:520px){.parts{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.cmp{grid-template-columns:1fr}.errs{grid-template-columns:1fr}.pager a{max-width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>

<div class="app">
<aside class="side" aria-label="Índice de reglas">
  <a class="brand" href="#inicio"><span class="flag" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span><b>RIPA</b><br><span>COLREG 1972 · reglas 1–19</span></span></a>
  <nav class="nav" aria-label="Reglas"></nav>
</aside>
<div>
  <div class="top"><button class="btn" id="menu" type="button" aria-label="Abrir índice">☰ Índice</button><b>Atlas del RIPA</b></div>
  <main id="view" tabindex="-1"></main>
</div>
</div>
<script>
'use strict';
/* ===== Utilidades geométricas (x este, y norte, rumbos 0=N horario, unidades en millas náuticas) ===== */
const D2R = Math.PI / 180, rad = d => d * D2R;
const w360 = a => ((a % 360) + 360) % 360;
const w180 = a => { a = w360(a); return a > 180 ? a - 360 : a; };
const dv = h => [Math.sin(rad(h)), Math.cos(rad(h))];
const brgOf = (a, b) => w360(Math.atan2(b.x - a.x, b.y - a.y) / D2R);
const dst = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const vel = v => { const d = dv(v.h); return [d[0] * v.s / 60, d[1] * v.s / 60]; };
const place = (M, h, s, T) => { const d = s * T / 60, u = dv(h); return { x: M.x - u[0] * d, y: M.y - u[1] * d }; };

/* Datos del par A-B: distancia, marcación, marcación relativa, CPA y TCPA */
function pair(a, b) {
  const rx = b.x - a.x, ry = b.y - a.y, A = vel(a), B = vel(b);
  const vx = B[0] - A[0], vy = B[1] - A[1], v2 = vx * vx + vy * vy;
  let tc = v2 > 1e-9 ? -(rx * vx + ry * vy) / v2 : 0; if (tc < 0) tc = 0;
  const cx = rx + vx * tc, cy = ry + vy * tc;
  const brg = w360(Math.atan2(rx, ry) / D2R);
  return { r: Math.hypot(rx, ry), brg, rel: w180(brg - a.h), cpa: Math.hypot(cx, cy), tcpa: tc };
}
/* Rumbo para que un buque de velocidad s desde p intercepte a un blanco (pos, vel nm/min) */
function interceptH(p, s, q, qv) {
  const rx = q.x - p.x, ry = q.y - p.y, k = s / 60;
  const a = qv[0] * qv[0] + qv[1] * qv[1] - k * k, b = 2 * (rx * qv[0] + ry * qv[1]), c = rx * rx + ry * ry;
  let t = null;
  if (Math.abs(a) < 1e-9) { if (Math.abs(b) > 1e-9) t = -c / b; }
  else { const d = b * b - 4 * a * c; if (d >= 0) { const t1 = (-b - Math.sqrt(d)) / (2 * a), t2 = (-b + Math.sqrt(d)) / (2 * a); t = Math.min(...[t1, t2].filter(x => x > 0)); if (!isFinite(t)) t = null; } }
  if (t == null || t <= 0) return brgOf(p, q);
  return w360(Math.atan2(rx + qv[0] * t, ry + qv[1] * t) / D2R);
}
function V(o) {
  const v = Object.assign({ type: 'MEC', name: '', x: 0, y: 0, h: 0, s: 10, rate: 30, size: 1, orders: [], tag: null, tagCol: null, trail: [], col: null, boom: 0, path: null, pi: 0, q: null, lights: true }, o);
  v.th = v.h; v.ts = v.s; return v;
}

/* ===== Dibujo de buques (vista cenital, proa hacia arriba) ===== */
function lightDot(ctx, x, y, c, r) { ctx.save(); ctx.shadowColor = c; ctx.shadowBlur = r * 5; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore(); }
function drawShip(ctx, type, u, o) {
  o = o || {}; const k = (o.size || 1) * ({ VEL: 0.72, PES: 0.86, NUC: 0.9, RAM: 0.95, CBD: 1.05 }[type] || 1);
  const L = 44 * u * k, B = (type === 'VEL' ? 9 : 14) * u * (o.size || 1);
  const night = !!o.night, col = o.col || '#cfd9e4';

function buildCtrls(host, defs, P, change) {

    const w = document.createElement('div'); w.className = 'ctl';

      w.innerHTML = `<span class="cl">${d.label}</span><div class="seg" role="group" aria-label="${d.label}">` + d.opts.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${String(P[d.k]) === String(v)}">${l}</button>`).join('') + '</div>';

    } else if (d.type === 'range') {

      const id = uid(); w.innerHTML = `<label class="ck" for="${id}"><input id="${id}" type="checkbox" ${P[d.k] ? 'checked' : ''}>${d.label}</label>`;
      $('input', w).onchange = e => { P[d.k] = e.target.checked; change(d.k); };
    } else if (d.type === 'select') {
      const id = uid(); w.innerHTML = `<label class="cl" for="${id}">${d.label}</label><select id="${id}">` + d.opts.map(([v, l]) => `<option value="${v}" ${P[d.k] === v ? 'selected' : ''}>${l}</option>`).join('') + '</select>';
      $('select', w).onchange = e => { P[d.k] = e.target.value; change(d.k); };
    }
    host.appendChild(w);

}

  <label class="ck"><input type="checkbox" data-a="night"> Noche (luces)</label></div>

rule(8, 'B1', 'Maniobras para evitar el abordaje', 'La maniobra debe ser anticipada, clara, decidida, eficaz y verificada.',
  ['Si las circunstancias lo permiten, la acción será franca, hecha con tiempo y con la debida observancia de la buena práctica marinera.', 'Todo cambio de rumbo o de velocidad debe ser lo bastante amplio para ser percibido por otro buque; deben evitarse los pequeños cambios sucesivos.', 'Si hay espacio, un cambio de rumbo considerable puede ser la acción más eficaz; la maniobra debe producir un paso franco y a distancia segura.', 'Se comprueba la eficacia hasta que el otro buque esté pasado y en franquía. Si es necesario, reducir velocidad, parar o invertir la propulsión.', 'Quien tenga obligación de no estorbar maniobra prontamente; esa obligación no cesa por aproximarse con riesgo de abordaje, y el otro buque sigue obligado por la Parte B.'],
  'Convierte la detección del riesgo en una acción comprensible para los demás buques. Una maniobra ambigua o tardía puede ser peor que no maniobrar.',
  'Mueva la distancia a la que se maniobra y la amplitud del giro. La gráfica muestra la franquía que se obtiene para cada cambio de rumbo.', [16, 17],
  host => stageManiobra(host));
rule(9, 'B1', 'Canales angostos', 'Cada buque navega tan cerca como sea seguro del límite exterior del canal por su banda de estribor.',
  ['Seguir tan cerca como sea seguro del límite exterior del canal que quede por su costado de estribor.', 'Los buques menores de 20 m y los de vela no deben estorbar el tránsito de buques que solo puedan navegar con seguridad dentro del canal; los buques dedicados a la pesca no deben estorbar a ningún otro dentro del canal.', 'No se debe cruzar el canal si ello estorba al buque que solo puede navegar con seguridad en él.', 'En un recodo sin visibilidad se navega alerta y con precaución, y se emite la señal acústica correspondiente. Debe evitarse fondear en el canal cuando las circunstancias lo permitan.'],
  'En espacios reducidos el margen de maniobra se estrecha y la disciplina de posición evita encuentros de frente.',
  'Alterne entre las situaciones. Navegar por el centro de un canal angosto convierte un cruce de rumbos opuestos en una vuelta encontrada.', [10, 18],
  host => simStage(host, { build: channelScene, P: { mode: 'estribor', cruce: 'ok' }, noNight: true, label: 'Tránsito de buques en un canal angosto',
    defs: [{ k: 'mode', type: 'seg', label: 'Situación', opts: [['estribor', 'Cada buque por su estribor'], ['centro', 'Ambos por el centro'], ['cruce', 'Buque menor que cruza'], ['recodo', 'Recodo sin visibilidad']] },
      { k: 'cruce', type: 'seg', label: 'Conducta del buque menor', opts: [['ok', 'Espera y cruza detrás'], ['mal', 'Cruza por delante']], when: P => P.mode === 'cruce' }] }));
rule(10, 'B1', 'Dispositivos de separación del tráfico', 'Los buques usan el carril apropiado, en el sentido general del tráfico, y evitan cruzar.',
  ['Usar la vía apropiada y seguir la dirección general del tráfico en ella.', 'Mantenerse, en lo posible, apartado de la línea o zona de separación.', 'Entrar o salir normalmente por los extremos; si lo hace lateralmente, con el menor ángulo posible respecto del flujo.', 'Evitar cruzar las vías; si es necesario, hacerlo lo más perpendicular posible al flujo.', 'Extremar la precaución en los extremos del dispositivo y evitar fondear dentro de él. Los buques que no lo usan se mantienen apartados con el mayor margen posible.'],
  'Ordena el tráfico intenso en zonas confluyentes, reduciendo los encuentros de frente y los cruces.',
  'Pruebe cada tipo de entrada y de cruce. El criterio es simple: ángulos pequeños para entrar, perpendicular para cruzar.', [1, 9],
  host => simStage(host, { build: tssScene, P: { mode: 'ext' }, noNight: true, label: 'Dispositivo de separación del tráfico',
    defs: [{ k: 'mode', type: 'seg', label: 'Maniobra del buque A', opts: [['ext', 'Entra por el extremo'], ['lat', 'Entrada lateral suave'], ['brusca', 'Entrada lateral brusca'], ['cruce', 'Cruce perpendicular'], ['oblicuo', 'Cruce oblicuo']] }] }));
rule(11, 'B2', 'Cuándo aplican las reglas de encuentro', 'Las reglas 12 a 18 se aplican solo cuando los buques están a la vista uno del otro.',
  ['Las reglas de la Sección II (12 a 18) se aplican únicamente a los buques que están a la vista uno del otro.', 'Si no están a la vista y navegan en condiciones de visibilidad reducida, debe analizarse la regla 19, además de las reglas generales de la Sección I.', '"A la vista" significa que un buque puede ser observado visualmente desde el otro; no basta con detectarlo por radar.'],
  'Distingue dos regímenes de conducta distintos. Aplicar las reglas de la Sección II a un buque que solo se ve en la pantalla del radar es un error de método.',
  'Mueva el control de visibilidad: el límite del alcance visual decide qué sección rige durante el acercamiento.', [4, 19],
  host => simStage(host, { build: fogScene, P: { vis: 2.5 }, noNight: true, label: 'Dos buques que se aproximan con visibilidad limitada',
    defs: [{ k: 'vis', type: 'range', label: 'Alcance visual (mn)', min: 0.5, max: 6, step: 0.1, fmt: v => v.toFixed(1) + ' mn' }] }));
rule(12, 'B2', 'Buques de vela', 'Entre dos buques de vela, la banda de recepción del viento y el barlovento determinan quién se aparta.',
  ['Con viento por bandas contrarias, el buque que recibe el viento por babor se mantiene apartado del otro.', 'Con viento por la misma banda, el buque de barlovento se mantiene apartado del que está a sotavento.', 'Si recibe el viento por babor y no puede determinar con certeza la banda del otro, se mantiene apartado.', 'La banda de barlovento se determina respecto de la vela mayor cazada (o de la mayor vela de cuchillo en aparejo cruzado).'],
  'Los veleros no usan la regla de estribor de los buques de propulsión mecánica: su criterio depende del viento.',
  'Cambie de situación y observe la posición de la botavara. El buque de la bandera naranja es quien debe apartarse.', [15, 18],
  host => simStage(host, { build: sailScene, P: { mode: 'contrarias' }, noNight: true, label: 'Dos veleros que se aproximan',
    defs: [{ k: 'mode', type: 'seg', label: 'Situación', opts: [['contrarias', 'Viento por bandas contrarias'], ['misma', 'Viento por la misma banda'], ['duda', 'Duda sobre la banda del otro']] }] }));
rule(13, 'B2', 'Buque que alcanza', 'Quien alcanza se mantiene apartado de la derrota del alcanzado hasta pasarlo y quedar en franquía.',
  ['El buque que alcanza debe mantenerse apartado de la derrota del buque alcanzado, cualquiera que sea la maniobra.', 'Alcanza quien se aproxima desde una marcación a más de 22,5° a popa del través del otro buque.', 'De noche, solo vería la luz de alcance y ninguna luz de costado.', 'Si existe duda sobre si está alcanzando, debe considerarse buque que alcanza. La obligación continúa hasta adelantar completamente.'],
  'Tiene prioridad sobre las reglas de cruce: un buque que alcanza no pasa a ser buque en situación de cruce por un cambio de marcación posterior.',
  'Modifique la marcación: por debajo de 112,5° desde la proa (22,5° a popa del través) ya no es alcance, sino cruce.', [15, 18],
  host => simStage(host, { build: overtakeScene, P: { brg: 165, q: 'estribor' }, label: 'Un buque rápido que alcanza a otro más lento',
    defs: [{ k: 'brg', type: 'range', label: 'Marcación de B desde A (desde la proa)', min: 100, max: 180, step: 5, fmt: v => v + '°' }, { k: 'q', type: 'seg', label: 'B viene por', opts: [['estribor', 'Aleta de estribor'], ['babor', 'Aleta de babor']] }] }));
rule(14, 'B2', 'Vuelta encontrada', 'Dos buques de propulsión mecánica en rumbos opuestos o casi opuestos caen ambos a estribor.',
  ['Se aplica cuando dos buques de propulsión mecánica navegan en rumbos opuestos o casi opuestos con riesgo de abordaje.', 'Cada uno caerá a estribor, de modo que pasen por la banda de babor del otro.', 'Se reconoce porque el otro buque se ve por la proa o casi por la proa; de noche, luces de tope alineadas o casi alineadas y/o ambas luces de costado.', 'Si hay duda de que sea una vuelta encontrada, se supone que existe y se actúa en consecuencia.'],
  'Es la única situación simétrica: ambos buques tienen la misma obligación y deben ejecutarla de la misma forma.',
  'Compruebe qué ocurre si uno cae a babor mientras el otro cae a estribor. Active la vista nocturna para ver las luces.', [15, 8],
  host => simStage(host, { build: headOnScene, P: { mode: 'ok' }, label: 'Dos buques de propulsión mecánica en rumbos opuestos',
    defs: [{ k: 'mode', type: 'seg', label: 'Situación', opts: [['ok', 'Ambos a estribor'], ['babor', 'Uno cae a babor'], ['duda', 'Rumbos casi opuestos']] }] }));
rule(15, 'B2', 'Situación de cruce', 'Quien tiene al otro por su costado de estribor se mantiene apartado y evita cortarle la proa.',
  ['Se aplica a dos buques de propulsión mecánica que se cruzan con riesgo de abordaje.', 'El buque que tiene al otro por su costado de estribor se mantiene apartado de la derrota del otro.', 'Si las circunstancias lo permiten, evita cortarle la proa al otro buque.', 'De noche, quien percibe la luz roja del otro por su estribor es el que debe ceder el paso.'],
  'Es el encuentro más frecuente en la mar: la mayoría de las aproximaciones no son de frente ni por alcance, sino con rumbos que se cortan.',
  'Cambie qué buque cede y cómo pasa. Active la vista nocturna: la luz que A observa de B indica quién debe apartarse.', [14, 16, 17],
  host => simStage(host, { build: crossingScene, P: cross(), label: 'Dos buques de propulsión mecánica con rumbos que se cortan',
    defs: [{ k: 'who', type: 'seg', label: 'Posición de B respecto de A', opts: [['estribor', 'B por estribor de A (A cede)'], ['babor', 'B por babor de A (B cede)']] }, { k: 'act', type: 'seg', label: 'Cómo pasa el buque que cede', opts: [['popa', 'Por la popa del otro'], ['proa', 'Cortando la proa']] }] }));
rule(16, 'B2', 'Buque que cede el paso', 'Debe maniobrar con anticipación suficiente y de forma decidida para quedar bien franco del otro.',
  ['Todo buque obligado a mantenerse apartado de la derrota de otro maniobrará, en lo posible, con anticipación suficiente y de forma decidida.', 'La maniobra debe ser temprana, clara y perceptible.', 'No basta con una corrección tardía o ambigua.', 'Se vincula directamente con la regla 8: cambios amplios, no pequeñas correcciones sucesivas.'],
  'Convierte la obligación abstracta de "apartarse" en una conducta observable que el otro buque pueda interpretar sin dudas.',
  'Ensaye una maniobra decidida, una tardía y una de pequeñas correcciones. Mida la franquía con la distancia mínima alcanzada.', [8, 17],
  host => simStage(host, { build: crossingScene, P: cross({ dist: 2.2, turn: 60 }), label: 'El buque A debe ceder el paso al buque B',
    defs: [{ k: 'act', type: 'seg', label: 'Maniobra de A', opts: [['popa', 'Decidida y a tiempo'], ['tardia', 'Tardía'], ['ambigua', 'Pequeñas correcciones'], ['ninguna', 'No maniobra']] }, { k: 'dist', type: 'range', label: 'Distancia a la que maniobra', min: 0.8, max: 3, step: 0.1, fmt: v => v.toFixed(1) + ' mn', when: P => P.act === 'popa' || P.act === 'ambigua' }, { k: 'turn', type: 'range', label: 'Amplitud del cambio de rumbo', min: 10, max: 90, step: 5, fmt: v => v + '°', when: P => P.act !== 'ninguna' && P.act !== 'tardia' }] }));
rule(17, 'B2', 'Buque que sigue a rumbo', 'Mantiene rumbo y velocidad, pero puede y debe maniobrar cuando el otro no actúa a tiempo.',
  ['Cuando uno de dos buques debe apartarse, el otro mantiene su rumbo y velocidad.', 'Puede maniobrar tan pronto como resulte evidente que el otro buque no actúa de acuerdo con las reglas.', 'Si el abordaje no puede evitarse solo con la maniobra del que cede, debe actuar de la manera que mejor contribuya a evitarlo.', 'En situación de cruce, debe evitar, si las circunstancias lo permiten, caer a babor para un buque que está por su propia banda de babor.', 'La regla 17 no libera al buque que cede el paso de su obligación de mantenerse apartado.'],
  'Equilibra la previsibilidad (el que cede puede calcular) con la seguridad (nadie queda atado a una regla cuando el otro falla).',
  'Observe las tres etapas por distancia. Compare cuándo conviene maniobrar y por qué caer a babor reduce la franquía.', [2, 16],
  host => simStage(host, { build: standOnScene, P: { mode: 'mantener', bAct: 'no' }, label: 'El buque A sigue a rumbo; el buque B debe ceder y no lo hace',
    defs: [{ k: 'mode', type: 'seg', label: 'Conducta del buque A', opts: [['mantener', 'Mantiene hasta el final'], ['e2', 'Maniobra en etapa 2'], ['e3', 'Maniobra en etapa 3'], ['babor', 'Cae a babor (a evitar)']] }, { k: 'bAct', type: 'seg', label: 'Conducta del buque B', opts: [['no', 'No cede'], ['tarde', 'Cede tarde']] }],
    tick: (sim, host) => { const r = pair(sim.vs[0], sim.vs[1]).r, k = r > 1.7 ? 0 : r > 1.1 ? 1 : 2, t = $('.tl', host); if (t) [...t.children].forEach((d, i) => d.classList.toggle('on', i === k)); },
    init: api => { api.extra.innerHTML = '<div class="cl" style="margin:12px 0 4px">Etapa según la distancia entre buques</div><div class="tl"><div>1 · MANTENER</div><div>2 · PUEDE MANIOBRAR</div><div>3 · DEBE ACTUAR</div></div>'; } }));
rule(18, 'B2', 'Responsabilidades entre categorías', 'Establece quién se aparta de quién según la capacidad de maniobra de cada categoría de buque.',
  ['Propulsión mecánica: se aparta de sin gobierno, maniobra restringida, pesca y vela.', 'Vela: se aparta de sin gobierno, maniobra restringida y pesca.', 'Pesca: en la medida de lo posible, se aparta de sin gobierno y maniobra restringida.', 'Todos, salvo los sin gobierno y de maniobra restringida, evitan estorbar a un buque restringido por su calado que exhiba las señales de la regla 28.', 'La regla 18 está subordinada a las reglas 9 (canales angostos), 10 (separación del tráfico) y 13 (alcance).'],
  'Reconoce que los buques con menos capacidad de maniobra no pueden apartarse como los demás, y traslada la obligación a quien sí puede.',
  'Elija dos categorías en la matriz o con los selectores. La simulación muestra quién se aparta y por qué.', [3, 12, 15],
  host => stageHierarquia(host));
rule(19, 'B3', 'Conducta en visibilidad reducida', 'Velocidad segura, máquinas listas y especial cuidado con las maniobras que deben evitarse.',
  ['Se aplica a buques que no están a la vista uno del otro cuando navegan cerca o dentro de una zona de visibilidad reducida.', 'Velocidad de seguridad adaptada a la visibilidad; los buques de propulsión mecánica tienen las máquinas listas para maniobrar de inmediato.', 'Con radar, se determina si se crea una aproximación excesiva o riesgo y se maniobra con suficiente antelación. Se evita, en lo posible, caer a babor para un blanco a proa del través (salvo que se le alcance) y alterar el rumbo hacia un buque por el través o por la popa.', 'Si se oye una señal de niebla aparentemente a proa del través, o no puede evitarse la aproximación excesiva, se reduce a la velocidad mínima de gobierno; si es necesario, se suprime la arrancada y se navega con extremo cuidado.'],
  'La niebla no suspende la vigilancia: exige mayor cautela, velocidad segura y disponibilidad inmediata para maniobrar.',
  'Coloque un blanco en la pantalla de radar (toque o arrastre) y vea qué maniobras desaconseja la regla.', [5, 6, 7],
  host => stageRadar(host));

/* ===== Escenarios personalizados ===== */
function stageAmbito(host) {
  const Z = [['Alta mar', 'Todos los buques', 'Rige el RIPA completo. Es el ámbito principal del reglamento.'], ['Dispositivo de separación del tráfico', 'OMI', 'La OMI puede adoptar dispositivos de separación del tráfico; rige la regla 10 junto con el RIPA.'], ['Aguas comunicadas con alta mar', 'Navegables por buques de navegación marítima', 'Rige el RIPA: estuarios, accesos y bahías abiertas navegables por buques de navegación marítima.'], ['Puerto y rada', 'Reglas especiales locales', 'Las autoridades pueden dictar reglas especiales; deben coincidir en lo posible con el RIPA. Se admiten señales adicionales sin confusión.'], ['Río y aguas interiores', 'Reglas especiales locales', 'Ríos, lagos y aguas interiores pueden tener reglas propias. El capitán debe conocerlas antes de maniobrar.']];
  host.innerHTML = `<div class="stage"><div class="svgw"><svg viewBox="0 0 800 420" role="img" aria-label="Zonas de aplicación del RIPA">
  <rect width="800" height="420" fill="#0e3d5e"/>
  <path d="M800 0H470C500 50 560 80 590 120C610 150 615 185 600 215C650 240 700 245 800 245Z" fill="#37503a"/>
  <path d="M560 235L560 175L640 175L640 235" fill="none"/>
  <rect x="575" y="150" width="70" height="60" fill="#0e3d5e"/><path d="M572 150L572 215M648 150L648 215" stroke="#9db3c9" stroke-width="5"/>
  <path d="M645 165C690 150 700 110 740 100C770 92 790 70 800 50" fill="none" stroke="#0e3d5e" stroke-width="22" stroke-linecap="round"/>
  <ellipse cx="730" cy="190" rx="52" ry="26" fill="#0e3d5e"/>
  <g transform="rotate(-18 285 305)"><rect x="205" y="278" width="170" height="54" fill="rgba(255,92,200,.12)" stroke="rgba(255,92,200,.6)"/><line x1="205" y1="305" x2="375" y2="305" stroke="rgba(255,92,200,.6)" stroke-dasharray="5 4"/><path d="M235 291l22 0-5-5m5 5-5 5M345 319l-22 0 5-5m-5 5 5 5" stroke="#ff7ad8" stroke-width="2" fill="none"/></g>
  <g font-family="IBM Plex Mono,monospace" font-size="12" fill="#cfe3f5"><text x="50" y="80">ALTA MAR</text><text x="215" y="372">DST (regla 10)</text><text x="400" y="225">AGUAS COMUNICADAS</text><text x="582" y="140">PUERTO</text><text x="682" y="85">RÍO</text><text x="700" y="195" font-size="11">lago</text></g>
  <path id="rt" d="M40 380L250 322L420 262L530 205L610 185L650 160L740 110L790 60" fill="none" stroke="rgba(245,197,66,.45)" stroke-width="2" stroke-dasharray="6 6"/>
  <g id="sh"><path d="M0 -13L7 9L0 5L-7 9Z" fill="#f5c542" stroke="#071320" stroke-width="1.5"/></g></svg></div>
  <div class="ctrls"><div class="ctl"><label class="cl" for="rt1">Posición del buque en la derrota</label><div class="rg"><input id="rt1" type="range" min="0" max="1000" value="80" style="width:320px"></div></div><label class="ck"><input type="checkbox" id="auto" ${reduced ? '' : 'checked'}> Navegar automáticamente</label></div>
  <div class="zones" role="group" aria-label="Zonas"></div><div class="hud"><dl></dl><p class="msg info"></p></div></div>`;
  const path = $('#rt', host), sh = $('#sh', host), L = path.getTotalLength(), inp = $('#rt1', host), zs = $('.zones', host), dl = $('dl', host), msg = $('.msg', host), auto = $('#auto', host);
  const bounds = [0, .2, .36, .55, .8, 1.001]; zs.innerHTML = Z.map((z, i) => `<button type="button" class="chip" data-i="${i}" aria-pressed="false">${z[0]}</button>`).join('');
  let p = .08, raf, last = performance.now(), zi = -1; const zoneOf = q => { for (let i = 0; i < 5; i++) if (q < bounds[i + 1]) return i; return 4; };
  const set = q => { p = q; const pt = path.getPointAtLength(L * Math.min(1, Math.max(0, p))), pt2 = path.getPointAtLength(L * Math.min(1, p + .004)), pt1 = path.getPointAtLength(L * Math.max(0, p - .004)); const a = Math.atan2(pt2.x - pt1.x, -(pt2.y - pt1.y)) * 180 / Math.PI; sh.setAttribute('transform', `translate(${pt.x} ${pt.y}) rotate(${a})`); inp.value = Math.round(p * 1000); const i = zoneOf(p); if (i !== zi) { zi = i; zs.querySelectorAll('button').forEach((b, j) => b.setAttribute('aria-pressed', j === i)); dl.innerHTML = `<div><dt>Zona actual</dt><dd>${Z[i][0]}</dd></div><div><dt>Quién aplica</dt><dd>${Z[i][1]}</dd></div>`; msg.textContent = Z[i][2]; } };
  zs.onclick = e => { const b = e.target.closest('button'); if (!b) return; auto.checked = false; set(bounds[+b.dataset.i] + .02); };
  inp.oninput = () => { auto.checked = false; set(inp.value / 1000); };
  last = performance.now(); const frame = now => { const dt = (now - last) / 1000; last = now; if (auto.checked) { p += dt * 0.05; if (p > 1) p = 0; set(p); } raf = requestAnimationFrame(frame); }; set(p); raf = requestAnimationFrame(frame); cleanups.push(() => cancelAnimationFrame(raf));
}
function stageDefs(host) {
  const T = [['MEC', 'Propulsión mecánica', 'Buque movido por una máquina.'], ['VEL', 'Buque de vela', 'Navega a vela y no utiliza su maquinaria propulsora, si la lleva.'], ['PES', 'Dedicado a la pesca', 'Pesca con artes que restringen su maniobrabilidad; no incluye el curricán.'], ['NUC', 'Sin gobierno', 'Por una circunstancia excepcional es incapaz de maniobrar como exige el RIPA.'], ['RAM', 'Maniobra restringida', 'La naturaleza de su trabajo reduce su capacidad para apartarse (dragado, trabajos submarinos, remolque que lo restrinja fuertemente).'], ['CBD', 'Restringido por su calado', 'Buque de propulsión mecánica cuyo calado, respecto de la profundidad y anchura disponibles, restringe mucho su capacidad de apartarse.']];
  const tree = [['¿Está fondeado, amarrado a tierra o varado?', 'No está «en navegación»', 'La definición de «en navegación» excluye al buque fondeado, amarrado a tierra o varado.'], ['¿Una circunstancia excepcional le impide maniobrar como exige el RIPA?', 'Buque sin gobierno', 'No puede apartarse de la derrota de otro buque por una circunstancia excepcional (por ejemplo, una avería de gobierno).'], ['¿La naturaleza de su trabajo reduce su capacidad para apartarse?', 'Capacidad de maniobra restringida', 'Dragado, trabajos submarinos o remolque que restrinja fuertemente su capacidad de apartarse.'], ['¿Pesca con artes que restringen su maniobrabilidad?', 'Buque dedicado a la pesca', 'El curricán u otros artes que no restrinjan la maniobra no dan esta condición.'], ['¿Es de propulsión mecánica y su calado, respecto del agua disponible, restringe mucho su capacidad de apartarse?', 'Restringido por su calado', 'Se evalúa la relación entre calado y profundidad y anchura disponibles.'], ['¿Navega a vela sin usar su maquinaria propulsora?', 'Buque de vela', 'Si lleva máquina, no debe estar empleándola.']];
  host.innerHTML = `<div class="stage"><div class="qa"><div class="cl" style="margin-bottom:8px">Clasificador de categorías · responda según la condición real del buque</div><div class="trail"></div><div class="qbox"></div></div></div>

      if (fwd) { wedge(-90, 0, bad ? 'rgba(255,85,102,.28)' : 'rgba(39,224,140,.12)'); wedge(0, 90, 'rgba(39,224,140,.14)'); } else { if (rel > 0) { wedge(0, 90, 'rgba(255,85,102,.28)'); wedge(-90, 0, 'rgba(39,224,140,.14)'); } else { wedge(-90, 0, 'rgba(255,85,102,.28)'); wedge(0, 90, 'rgba(39,224,140,.14)'); } }
      ctx.strokeStyle = 'rgba(77,255,176,.28)'; ctx.lineWidth = 1; for (let r = 1; r <= 6; r++) { ctx.beginPath(); ctx.arc(c, c, r * sc, 0, 7); ctx.stroke(); } ctx.beginPath(); ctx.moveTo(c - R, c); ctx.lineTo(c + R, c); ctx.moveTo(c, c - R); ctx.lineTo(c, c + R); ctx.stroke();
      ctx.fillStyle = 'rgba(77,255,176,.7)'; ctx.font = `500 ${10.5 * u}px "IBM Plex Mono"`; ctx.textAlign = 'left'; for (let r = 2; r <= 6; r += 2) ctx.fillText(r + ' mn', c + 4 * u, c - r * sc - 3 * u);
      const a = T * 1.8; const g = ctx.createConicGradient ? ctx.createConicGradient(a - Math.PI / 2 - 0.6, c, c) : null; ctx.save(); ctx.beginPath(); ctx.arc(c, c, R, 0, 7); ctx.clip(); if (g) { g.addColorStop(0, 'rgba(77,255,176,0)'); g.addColorStop(0.1, 'rgba(77,255,176,.28)'); g.addColorStop(0.1001, 'rgba(77,255,176,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); } ctx.restore(); ctx.strokeStyle = 'rgba(77,255,176,.9)'; ctx.lineWidth = 2 * u; ctx.beginPath(); ctx.moveTo(c, c); ctx.lineTo(c + Math.sin(a) * R, c - Math.cos(a) * R); ctx.stroke();
      /* blanco */
      const tx = c + st.x * sc, ty = c - st.y * sc; ctx.fillStyle = '#7cf0ff'; ctx.beginPath(); ctx.arc(tx, ty, 6 * u, 0, 7); ctx.fill(); ctx.strokeStyle = '#7cf0ff'; ctx.lineWidth = 1.5 * u; ctx.beginPath(); ctx.arc(tx, ty, 12 * u + Math.sin(T * 4) * 2 * u, 0, 7); ctx.stroke(); ctx.setLineDash([4 * u, 4 * u]); ctx.beginPath(); ctx.moveTo(c, c); ctx.lineTo(tx, ty); ctx.stroke(); ctx.setLineDash([]);
      ctx.save(); ctx.translate(c, c); drawShip(ctx, 'MEC', u * 0.9, { col: '#6fb7ff' }); ctx.restore(); ctx.fillStyle = '#fff'; ctx.font = `600 ${11.5 * u}px "IBM Plex Sans"`; ctx.textAlign = 'center'; ctx.fillText(bad ? (bad[0] < 0 ? 'EVITAR CAER A BABOR' : 'EVITAR CAER A ESTRIBOR') : 'SIN RESTRICCIÓN ESPECIAL', c + (bad ? (bad[0] < 0 ? -R * 0.55 : R * 0.55) : 0), c + (bad ? -R * 0.55 : -R * 0.82)); ctx.fillStyle = 'rgba(77,255,176,.8)'; ctx.fillText('N proa', c, 18 * u); },
    hud: P => { const rel = w180(Math.atan2(st.x, st.y) / D2R), fwd = Math.abs(rel) < 90, d = Math.hypot(st.x, st.y), side = rel >= 0 ? 'estribor' : 'babor'; let m, k = 'info';
      if (P.niebla && fwd) { m = 'Señal de niebla aparentemente a proa del través: reducir a la velocidad mínima de gobierno; si es necesario, suprimir la arrancada y navegar con extremo cuidado hasta que pase el peligro.'; k = 'warn'; }
      else if (fwd) m = P.alcanzado ? 'Blanco a proa del través pero se le alcanza: la restricción de caer a babor no se aplica.' : 'Blanco a proa del través: evite, en lo posible, caer a babor. La maniobra preferible es hacia estribor, o reducir velocidad.';
      else m = `Blanco por el través o la popa, por ${side}: evite alterar el rumbo hacia él (hacia ${side}).`;
      return { rows: [['Marcación del blanco', Math.abs(rel).toFixed(0) + '° por ' + side], ['Distancia', d.toFixed(1) + ' mn'], ['Posición', fwd ? 'a proa del través' : 'por el través o la popa'], ['Velocidad', 'segura · máquinas listas']], msg: m, k }; } });
}

/* ===== Páginas generales ===== */
const ORDER = ['inicio', ...Array.from({ length: 19 }, (_, i) => 'regla-' + (i + 1)), 'metodo', 'errores', 'conclusiones'];
const GROUPS = [['Parte A · Generalidades', [1, 2, 3]], ['Parte B · Sección I · Cualquier visibilidad', [4, 5, 6, 7, 8, 9, 10]], ['Parte B · Sección II · A la vista', [11, 12, 13, 14, 15, 16, 17, 18]], ['Parte B · Sección III · Visibilidad reducida', [19]]];
const TITLES = { inicio: 'Inicio', metodo: 'Método de seis pasos', errores: 'Errores frecuentes', conclusiones: 'Conclusiones' };
function titleOf(id) { return id.startsWith('regla-') ? `Regla ${id.slice(6)} · ${R[+id.slice(6)].title}` : TITLES[id]; }
function buildNav() {
  const nav = $('.nav'); let h = `<a href="#inicio" data-id="inicio"><b>★</b>Inicio</a>`;
  GROUPS.forEach(([g, ns]) => { h += `<div class="grp">${g}</div>` + ns.map(n => `<a href="#regla-${n}" data-id="regla-${n}"><b>${n}</b>${R[n].title}</a>`).join(''); });
  h += `<div class="grp">Síntesis</div><a href="#metodo" data-id="metodo"><b>6</b>Método de seis pasos</a><a href="#errores" data-id="errores"><b>!</b>Errores frecuentes</a><a href="#conclusiones" data-id="conclusiones"><b>✓</b>Conclusiones</a>`; nav.innerHTML = h;
}
function pager(id) { const i = ORDER.indexOf(id), p = ORDER[i - 1], n = ORDER[i + 1]; return `<nav class="pager" aria-label="Navegación entre secciones">${p ? `<a href="#${p}"><small>← Anterior</small>${esc(titleOf(p))}</a>` : '<span></span>'}${n ? `<a href="#${n}"><small>Siguiente →</small>${esc(titleOf(n))}</a>` : ''}</nav>`; }

function pageRule(n) {
  const r = R[n], v = $('#view');
  v.innerHTML = `<header class="rhead"><div class="rnum" aria-hidden="true">${n}</div><div><p class="eyebrow">${PARTS[r.part]}</p><h1>${r.title}</h1><p class="lead">${r.lead}</p></div></header>
  <div class="work"><div class="sh" id="sh"></div><aside><div class="card"><h3>Qué establece</h3><ul>${r.est.map(e => `<li>${e}</li>`).join('')}</ul></div><div class="card"><h3>Por qué importa</h3><p>${r.imp}</p></div><div class="card"><h3>Cómo se aplica</h3><p>${r.apl}</p></div><div class="card"><h3>Reglas relacionadas</h3><div class="chips">${r.rel.map(link).join('')}</div></div></aside></div>${pager('regla-' + n)}`;
  r.stage($('#sh'));
}
function pageInicio() {
  const v = $('#view'); const hs = Array.from({ length: 19 }, (_, i) => i + 1);
  v.innerHTML = `<div class="hero"><div><p class="eyebrow">Reglamento Internacional para Prevenir los Abordajes · COLREG 1972</p><h1>RIPA: <em>reglas 1 a 19</em> en movimiento</h1><p class="lead">Cada regla se explica con un diagrama o una simulación que puede pausar, reiniciar y modificar. Los buques de color azul y amarillo son A y B; las bandas verdes y rojas muestran los sectores de luces de costado.</p><p style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"><a class="btn pri" href="#regla-1" style="text-decoration:none">Comenzar por la regla 1</a><a class="btn" href="#regla-15" style="text-decoration:none">Ir al cruce (regla 15)</a></p></div><div><div class="cvw"><canvas aria-label="Animación de dos buques en situación de cruce"></canvas></div></div></div>
  <div class="parts"><div class="part on"><span>Parte A</span><b>1–3</b>Generalidades</div><div class="part on"><span>Parte B</span><b>4–19</b>Rumbo y gobierno</div><div class="part off"><span>Parte C · fuera de alcance</span><b>20–31</b>Luces y marcas</div><div class="part off"><span>Parte D · fuera de alcance</span><b>32–37</b>Señales acústicas y luminosas</div></div>
  <p class="lead" style="margin-bottom:6px">Idea rectora: el RIPA no es una tabla automática de «derechos de paso»; es un sistema de vigilancia, evaluación continua y maniobra segura.</p>
  <h2 class="sec-h">Las 19 reglas</h2><div class="rgrid">${hs.map(n => `<a class="rg1" href="#regla-${n}"><b>${n}</b><span>${R[n].title}</span></a>`).join('')}</div>
  <h2 class="sec-h">Casos de navegación · ¿qué regla activa el análisis?</h2><div class="cases">
  <a class="case" href="#regla-7"><small>A · Reglas 5, 6 y 7</small><h4>Demora constante</h4><p>Mantener vigilancia, evaluar el riesgo y ajustar la velocidad; ante la duda, asumir que existe riesgo.</p></a>
  <a class="case" href="#regla-14"><small>B · Regla 14</small><h4>Dos buques de frente</h4><p>Ambos buques de propulsión mecánica caen a estribor para pasar por babor del otro.</p></a>
  <a class="case" href="#regla-15"><small>C · Reglas 15–17</small><h4>Otro buque por estribor</h4><p>Quien lo tiene por estribor cede el paso; el otro sigue a rumbo, sin dejar de vigilar.</p></a>
  <a class="case" href="#regla-13"><small>D · Regla 13</small><h4>Alcance por popa</h4><p>El buque que alcanza permanece apartado hasta pasar y quedar en franquía.</p></a>
  <a class="case" href="#regla-19"><small>E · Regla 19</small><h4>Niebla y contacto de radar</h4><p>Velocidad segura, máquinas listas, evaluar la aproximación y evitar maniobras desaconsejadas.</p></a>
  <a class="case" href="#metodo"><small>Síntesis</small><h4>Método de seis pasos</h4><p>Vigilar, detectar, evaluar, decidir, maniobrar y verificar.</p></a></div>
  <p class="lead" style="margin-top:22px;font-size:14px;color:var(--ink3)">Alcance: Partes A y B (reglas 1 a 19). Material didáctico: para operaciones reales, consulte la versión oficial vigente y las disposiciones locales aplicables.</p>`;
  /* animación de portada */
  const cv = $('canvas', v), wrap = $('.cvw', v), sim = new Sim(cv, crossingScene, cross({ noTag: false })); sim.night = false; sim.playing = !reduced; sim.loop = true; sim.rate = 1.1; let raf, last = performance.now();
  const fit = () => { fitCanvas(cv, wrap); sim.draw(); }; const ro = new ResizeObserver(fit); ro.observe(wrap); fit();
  const fr = now => { sim.advance((now - last) / 1000); last = now; sim.draw(); raf = requestAnimationFrame(fr); }; raf = requestAnimationFrame(fr); cleanups.push(() => { cancelAnimationFrame(raf); ro.disconnect(); });
}
function pageMetodo() {
  const v = $('#view'); v.innerHTML = `<header class="rhead"><div class="rnum" aria-hidden="true">6</div><div><p class="eyebrow">Síntesis operativa</p><h1>Método práctico para prevenir un abordaje</h1><p class="lead">El proceso es continuo: después de maniobrar se sigue comprobando la situación hasta que el otro buque esté pasado y en franquía. Toque un paso para ir a ese momento de la simulación.</p></div></header><div class="work"><div id="sh"></div><aside><div class="card"><h3>Qué hace cada paso</h3><ul><li><strong>Vigilar</strong>: vista, oído y radar (regla 5).</li><li><strong>Detectar</strong>: identificar blancos y su movimiento.</li><li><strong>Evaluar</strong>: demora, CPA/TCPA y contexto (reglas 6 y 7).</li><li><strong>Decidir</strong>: regla aplicable y riesgo (reglas 11 a 19).</li><li><strong>Maniobrar</strong>: anticipado, claro y decidido (reglas 8 y 16).</li><li><strong>Verificar</strong>: paso seguro hasta la franquía.</li></ul></div><div class="card"><h3>Reglas relacionadas</h3><div class="chips">${[5, 7, 8, 15, 16, 17].map(link).join('')}</div></div></aside></div>${pager('metodo')}`;
  const api = simStage($('#sh'), { build: metodoScene, P: {}, noNight: true, label: 'Aplicación de los seis pasos en un cruce',
    tick: (sim, host) => { const k = sim.sc.phase(sim.t); host.querySelectorAll('.step').forEach((s, i) => { s.classList.toggle('on', i === k); s.classList.toggle('done', i < k); }); },
    init: a => { const st = document.createElement('div'); st.className = 'steps'; st.innerHTML = PASOS.map((p, i) => `<button type="button" class="step" data-i="${i}"><b>${i + 1}</b><span>${p[1]}</span></button>`).join(''); a.host.querySelector('.stage').insertBefore(st, a.host.querySelector('.ctrls')); st.onclick = e => { const b = e.target.closest('.step'); if (b) a.seek(PASOS[+b.dataset.i][0] + 0.05); }; } });
}
function pageErrores() {
  const E = [['Confundir «no estorbar» con exención', 'La obligación de evitar el abordaje continúa para todos. El buque cuyo tránsito no debe estorbarse sigue obligado a cumplir las reglas de la Parte B.', [8]], ['Esperar hasta el último momento', 'La maniobra debe ser temprana, clara y decidida. Una acción tardía reduce la franquía y las opciones.', [8, 16]], ['Hacer pequeñas correcciones sucesivas', 'Pueden ser ambiguas e imperceptibles para el otro buque; la regla 8 pide cambios de rumbo o de velocidad perceptibles.', [8, 16]], ['Confiar únicamente en el radar', 'La vigilancia es visual, auditiva y con todos los medios apropiados. Un eco de radar no equivale a estar a la vista.', [5, 7, 11]], ['Tratar la prioridad como absoluta', 'Las reglas 2, 8 y 17 exigen valorar las circunstancias y actuar para evitar el abordaje, incluso apartándose de una regla ante un peligro inmediato.', [2, 17]], ['Clasificar un remolcador automáticamente', 'La maniobra restringida depende de si la operación restringe fuertemente su capacidad de apartarse; no de su nombre o tamaño.', [3, 18]]];
  $('#view').innerHTML = `<header class="rhead"><div class="rnum" aria-hidden="true">!</div><div><p class="eyebrow">Criterio marinero</p><h1>Errores frecuentes al interpretar el RIPA</h1><p class="lead">Seis errores que explican buena parte de los abordajes por mala aplicación del reglamento. Toque cada tarjeta para ver la corrección.</p></div></header><div class="errs">${E.map((e, i) => `<div class="err"><button type="button" aria-expanded="false"><span class="n">${i + 1}</span><span><h3>${e[0]}</h3></span></button><div class="ans"><p>${e[1]}</p><div class="chips">${e[2].map(link).join('')}</div></div></div>`).join('')}</div>${pager('errores')}`;
  document.querySelectorAll('.err button').forEach(b => b.onclick = () => { const p = b.closest('.err'); p.classList.toggle('open'); b.setAttribute('aria-expanded', p.classList.contains('open')); });
}
function pageConclusiones() {
  const C = [['Un reglamento de ámbito amplio', 'El RIPA se aplica en alta mar y aguas comunicadas con ella, y convive con reglas especiales compatibles (reglas 1 a 3).', [1]], ['La responsabilidad no desaparece', 'Cumplir formalmente una regla no exime de la responsabilidad del capitán y la dotación (regla 2).', [2]], ['Vigilancia, velocidad y riesgo', 'La vigilancia, la velocidad de seguridad y la determinación temprana del riesgo son permanentes (reglas 5 a 7).', [5, 6, 7]], ['Maniobras que se entienden', 'Las maniobras deben ser anticipadas, claras, decididas y verificadas hasta quedar en franquía (reglas 8 y 16).', [8, 16]], ['Obligaciones que se leen en conjunto', 'Ceder el paso, seguir a rumbo y no estorbar se interpretan conjuntamente, sin tratar la prioridad como absoluta (reglas 15 a 18).', [15, 17, 18]], ['La mejor maniobra evita la emergencia', 'La mejor maniobra es la que evita que una situación de riesgo llegue a convertirse en emergencia.', [19]]];
  $('#view').innerHTML = `<header class="rhead"><div class="rnum" aria-hidden="true">✓</div><div><p class="eyebrow">Cierre</p><h1>Conclusiones: lo que debe quedar claro</h1><p class="lead">Seis principios que articulan las Partes A y B del RIPA.</p></div></header><ol class="concl">${C.map(c => `<li><div><b>${c[0]}</b><p>${c[1]}</p><div class="chips" style="margin-top:8px">${c[2].map(link).join('')}</div></div></li>`).join('')}</ol><p class="lead" style="margin-top:22px">Alcance: reglas 1 a 19. Para operaciones reales, consulte la versión oficial vigente y las disposiciones locales aplicables.</p>${pager('conclusiones')}`;
}

/* ===== Enrutador ===== */
function route() {
  cleanups.forEach(f => f()); cleanups = [];
  let id = location.hash.slice(1); if (!ORDER.includes(id)) id = 'inicio';
  document.querySelectorAll('.nav a').forEach(a => { if (a.dataset.id === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (id === 'inicio') pageInicio(); else if (id.startsWith('regla-')) pageRule(+id.slice(6)); else if (id === 'metodo') pageMetodo(); else if (id === 'errores') pageErrores(); else pageConclusiones();
  document.title = id === 'inicio' ? 'Atlas del RIPA' : titleOf(id) + ' · Atlas del RIPA'; document.body.classList.remove('nav-open'); window.scrollTo(0, 0);
  const cur = document.querySelector('.nav a[aria-current]'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest' });
}
buildNav(); window.addEventListener('hashchange', route);
$('#menu').onclick = () => document.body.classList.toggle('nav-open');
document.addEventListener('keydown', e => { if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return; const i = ORDER.indexOf(location.hash.slice(1) || 'inicio'); if (e.key === 'ArrowRight' && i < ORDER.length - 1) location.hash = ORDER[i + 1]; if (e.key === 'ArrowLeft' && i > 0) location.hash = ORDER[i - 1]; });
route();
